:root{color-scheme:dark;--ink:#eef0ff;--muted:#a9aed6;--bg:#0a0f2c;--panel:#151c44;--panel2:#1c2552;--mint:#95f5d3;--sun:#ffd991;--rose:#ffa3b8;--line:#2c3670;--display:'Unbounded',system-ui,sans-serif;--text:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 70% 45% at 88% -5%,#3a2766 0,transparent 70%),radial-gradient(ellipse 60% 40% at -10% 100%,#0f3a4a 0,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.5 var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.4px),radial-gradient(#cfd8ff 1.5px,transparent 2px);background-size:83px 97px,211px 173px;background-position:0 0,40px 60px;opacity:.22}
header,main,footer{position:relative;max-width:1100px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:22px;white-space:nowrap}
.brand span{color:var(--mint)}
button,a{font:inherit}
button{cursor:pointer;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:11px 17px;min-height:44px;font-weight:700;transition:transform .15s,background .15s,border-color .15s}
button:hover{background:#26316a;border-color:#414c8c}
button:active{transform:translateY(1px) scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8e7ff;outline-offset:3px}
button.primary{background:var(--mint);border-color:var(--mint);color:#0d3a2e;font-weight:700;box-shadow:0 6px 22px -8px #95f5d3aa}
button.primary:hover{background:#b3fbe2}
button:disabled{opacity:.4;cursor:default;transform:none}
header .hud>button{background:transparent;border-radius:999px;font-size:15px;padding:9px 16px}
h1,h2,h3{font-family:var(--display);font-weight:800;color:var(--ink)}
h1{font-size:clamp(32px,6vw,58px);letter-spacing:-.035em;line-height:1.08;margin:12px 0 20px}
h2{font-size:clamp(21px,3.4vw,26px);letter-spacing:-.02em;font-weight:600;margin:34px 0 16px}
p{line-height:1.6;color:var(--muted);max-width:62ch}
.eyebrow{font-size:15px;font-weight:700;color:var(--mint)}
.spark{color:var(--sun)}
.hero{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:25px;padding:24px 0 8px}
.hero svg{width:100%;max-height:280px;filter:drop-shadow(0 18px 40px #8a6cff4d);animation:drift 7s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel) 60%);border:1px solid var(--line);border-radius:22px;padding:22px}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:4px 10px;background:#ffffff10;color:var(--muted);margin:2px 0}
/* Univers : chaque niveau est une planète, l'anneau montre les missions explorées */
.grade{position:relative;display:block;text-align:left;width:100%;min-height:160px;padding:20px;border-color:color-mix(in srgb,var(--accent) 28%,var(--line));overflow:hidden}
.grade:hover{border-color:var(--accent);background:linear-gradient(160deg,#222c60,var(--panel) 60%)}
.grade strong{display:block;font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1.1}
.grade p{margin:8px 0 14px;font-weight:400;font-size:15px;padding-right:44px}
.orb{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),#ffffff1c 0);display:grid;place-items:center}
.orb:after{content:'';width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff9 0,var(--accent) 38%,color-mix(in srgb,var(--accent) 45%,#0a0f2c) 100%);box-shadow:0 0 0 4px var(--panel)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.univers h1{color:var(--accent)}
.mission{display:flex;flex-direction:column;gap:10px;padding:18px}
.mission h3{font-family:var(--text);font-weight:700;font-size:18px;line-height:1.3;margin:0;min-height:46px}
.mission .row{margin-top:auto}
.mission button{padding:9px 13px;font-size:15px;min-height:42px}
.mission.done{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.mission.done .tag{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.number{font-family:var(--display);font-weight:600;color:var(--accent,var(--mint));font-size:13px;letter-spacing:.04em}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
.toolbar label{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--mint);margin:0}
input,select{font:inherit;color:var(--ink);background:#0b1130;border:1px solid #3a4580;border-radius:12px;padding:12px}
/* Jeu */
.game{max-width:640px;margin:10px auto 25px}
.game>.row span:last-child{font-weight:700;color:var(--muted)}
.game>.card{padding:22px;border-radius:26px;scroll-margin-top:10px}.qmini{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 12px;font-weight:700;font-size:14px;color:var(--muted)}.qmini .bar{flex:1;height:5px;border-radius:5px;background:#ffffff14;overflow:hidden}.qmini .bar span{display:block;height:100%;background:linear-gradient(90deg,#5fd8b6,var(--mint));border-radius:5px}.correction{scroll-margin-top:16px}.correction .bravo{color:var(--mint);font-weight:700}.correction.justfixed{animation:fixglow 1.2s ease-out}@keyframes fixglow{0%{box-shadow:0 0 0 0 #95f5d3aa}100%{box-shadow:0 0 0 14px #95f5d300}}
.question{font-family:var(--text);font-size:clamp(26px,5.4vw,40px);font-weight:700;line-height:1.4;text-align:center;min-height:120px;display:grid;place-items:center;overflow-wrap:anywhere;padding:10px 4px}
input.answer{width:100%;font-family:var(--text);font-weight:700;font-size:34px;text-align:center;margin:14px 0 10px;padding:14px;border-radius:16px;border:2px solid #3a4580;background:#070c26;caret-color:var(--mint)}
input.answer:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 4px #95f5d326}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:10px 0 18px}
.keypad button{font-family:var(--text);font-size:26px;font-weight:700;padding:12px 0;min-height:58px;border-radius:16px;box-shadow:inset 0 -4px 0 #0000004d}
.keypad button{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.keypad button.hit{animation:hit .16s ease-out}@keyframes hit{0%{transform:translateY(2px);box-shadow:inset 0 -1px 0 #0000004d;filter:brightness(1.25)}100%{transform:none}}.keypad button:active{box-shadow:inset 0 -1px 0 #0000004d;transform:translateY(2px)}
.keypad button:nth-child(4n):not(.primary){background:#2a2556;border-color:#463f86;color:var(--sun)}
.keypad button:nth-child(15){font-size:17px}
.keypad .primary{box-shadow:inset 0 -4px 0 #0000002e,0 6px 22px -8px #95f5d3aa}
.progress{position:relative;height:8px;border-radius:8px;background:#ffffff14;margin:16px 0 18px}
.progress span{position:relative;display:block;background:linear-gradient(90deg,#5fd8b6,var(--mint));height:100%;border-radius:8px;transition:width .3s}
.progress span:after{content:'✦';position:absolute;right:-7px;top:50%;transform:translateY(-52%);color:var(--sun);font-size:16px;text-shadow:0 0 10px #ffd991}
.score{font-family:var(--display);font-size:clamp(64px,14vw,96px);font-weight:800;color:var(--mint);letter-spacing:-.05em;line-height:1;margin:6px 0 10px}
.score span{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.correction{margin:12px 0;border-left:5px solid var(--line);padding:18px 20px}
.correction strong{font-weight:700;font-size:18px}
.correction.good{border-left-color:var(--mint)}
.correction.bad{border-left-color:var(--rose)}
.correction p{margin:8px 0 0}
.correction .toolbar{margin:12px 0 4px;gap:8px}
.correction input{max-width:180px}
.status{color:var(--mint);font-weight:700;font-size:15px}
.correction.bad .status{color:var(--rose)}
main>.card{margin-top:20px}
main>.card label{display:block;font-weight:700;margin-bottom:12px}
main>.card label input{display:block;width:100%;max-width:360px;margin-top:8px}
footer{font-size:13px;color:var(--muted);text-align:center;padding-bottom:35px;opacity:.8}
dialog{border:1px solid var(--line);border-radius:24px;max-width:440px;width:calc(100% - 32px);background:var(--panel);color:var(--ink);padding:26px}
dialog h2{margin-top:0}
dialog::backdrop{background:#030718cc;backdrop-filter:blur(3px)}
.toast{pointer-events:none;position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:14px 22px;background:#eef9ff;color:#122040;font-weight:700;border-radius:16px;z-index:10;box-shadow:0 12px 30px -10px #000;width:max-content;max-width:calc(100% - 32px);text-align:center}
.card>h2:first-child{margin-top:0}.grade .tag{font-weight:400}.correction .toolbar button{min-height:40px;padding:8px 13px;font-size:15px}
.hud{display:flex;align-items:center;gap:10px}
.stars{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#ffd99114;border:1px solid #ffd99140;color:var(--sun);font-weight:700;font-size:16px;white-space:nowrap}
.stars b{font-family:var(--display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.stars.pulse{animation:pulse .35s ease-out}
@keyframes pulse{40%{transform:scale(1.18);background:#ffd99140}}
.gain{display:inline-block;color:var(--sun);font-weight:700;margin:4px 0 6px}
.endbar{display:flex;justify-content:center;margin:4px 0 0}
.endbar button{background:transparent;border-style:dashed;color:var(--muted);font-size:15px}
.endbar button:hover{color:var(--ink);border-color:var(--rose)}
.launch{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.flyer{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(0 0 16px #8a6cffaa)}
.flyer svg{display:block}
.hero svg{transition:opacity .6s}.hero svg.away{opacity:0;transition:none}
header .hud>button{white-space:nowrap}
.flyer .flame{transform-box:fill-box;transform-origin:50% 0;animation:flame .12s linear infinite alternate}
@keyframes flame{to{transform:scaleY(1.25)}}
